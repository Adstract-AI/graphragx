# Experiment 1B: final end-to-end LLM comparison.
#
# Reuse the three winning NBFNet retriever runs from Experiment 0 and compare
# the three evidence configurations selected by Experiment 1A:
# - shortest-path union
# - PCST constant edge cost with lambda 1.0
# - PCST semantic edge cost with lambda 1.0
#
# Every run uses the same DeepSeek model and inference settings. Explanations
# are disabled by omitting --generate-explanation. Batch size and parallel-call
# count are both 500 so the persistence batch does not cap requested concurrency.

version = 1

[defaults]
args = [
  "--inference-only",
  "--dataset", "WebQSP",
  "--default",
  "--llm-provider", "deepseek",
  "--main-llm-model", "deepseek-v4-flash",
  "--reasoning-effort", "none",
  "--llm-inference-batch-size", "500",
  "--llm-inference-parallel-calls", "500",
]

[[runs]]
id = "exp1b_nbfnet_seed42_deepseek_sp"
args = [
  "--retriever-run-name", "exp0_nbfnet_seed42_retriever",
  "--subgraph-algorithm", "shortest_path",
  "--seed", "42",
  "--inference-run-name", "exp1b_nbfnet_seed42_deepseek_sp",
]

[[runs]]
id = "exp1b_nbfnet_seed42_deepseek_pcst_constant_l10"
args = [
  "--retriever-run-name", "exp0_nbfnet_seed42_retriever",
  "--subgraph-algorithm", "pcst",
  "--pcst-edge-cost-strategy", "constant",
  "--pcst-edge-cost", "1.0",
  "--seed", "42",
  "--inference-run-name", "exp1b_nbfnet_seed42_deepseek_pcst_constant_l10",
]

[[runs]]
id = "exp1b_nbfnet_seed42_deepseek_pcst_semantic_l10"
args = [
  "--retriever-run-name", "exp0_nbfnet_seed42_retriever",
  "--subgraph-algorithm", "pcst",
  "--pcst-edge-cost-strategy", "semantic",
  "--pcst-edge-cost", "1.0",
  "--seed", "42",
  "--inference-run-name", "exp1b_nbfnet_seed42_deepseek_pcst_semantic_l10",
]

[[runs]]
id = "exp1b_nbfnet_seed1337_deepseek_sp"
