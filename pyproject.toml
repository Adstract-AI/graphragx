[project]
name = "graphragx"
version = "0.1.0"
description = "A GNN-RAG pipeline for knowledge-graph question answering on WebQSP."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
    { name = "Andrea Stevanoska" },
    { name = "Viktor Kostadinoski" },
]
dependencies = [
    "datasets",
    "langchain-openai",
    "numpy>=1.26,<2",
    "openai",
    "pcst-fast==1.0.10",
    "pydantic",
    "python-dotenv",
    "qdrant-client",
    "torch",
    "transformers>=4.57,<5",
    "wandb",
]

[dependency-groups]
dev = [
    "pytest",
    "torch-geometric",
]

[tool.uv]
package = false
