# Experiment 0: select the strongest GNN retriever architecture.
#
# Fixed controls:
# - WebQSP full training and test splits
# - 32 epochs, batch size 1
# - answer threshold 0.5, minimum top-k 10, candidate limit 15
# - architecture-specific registered defaults
# - missing/incomplete-gold graphs skipped (the pipeline default)
# - W&B enabled and retriever weight upload disabled (pipeline defaults)
# - three repeated seeds: 42, 1337, 2026

version = 1

[defaults]
args = [
  "--retriever-only",
  "--dataset", "WebQSP",
  "--default",
  "--training-epochs", "10",
  "--training-start-instance", "0",
  "--training-batch-size", "1",
  "--training-device", "cuda",
  "--training-log-every", "50",
  "--wandb-training-log-every", "50",
  "--evaluation-log-every", "50",
  "--answer-threshold", "0.7",
  "--candidate-top-k", "10",
  "--candidate-limit", "15",
]

[[runs]]
id = "exp0_graphsage_seed42"
args = [
  "--gnn-architecture", "graphsage",
  "--seed", "42",
  "--training-run-name", "exp0_graphsage_seed42_model",
  "--evaluation-run-name", "exp0_graphsage_seed42_retriever",
]

[[runs]]
id = "exp0_graphsage_seed1337"
